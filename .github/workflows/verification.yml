name: Vérification

# Filet posé en amont, pour voir une incohérence avant qu'elle n'atteigne main.
# Sur main, c'est publication.yml qui lance ce même contrôle avant le pré-rendu,
# d'où l'exclusion ici : le faire tourner deux fois n'apprendrait rien.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Aucune dépendance à installer : le script n'utilise que la bibliothèque
      # standard, volontairement, pour rester lançable à la main sans venv.
      - name: Cohérence des traductions, des données et des fichiers
        run: python3 outils/verifier.py
