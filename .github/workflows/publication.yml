name: Publication

# Le site n'est plus publié tel quel : les pages sources ne contiennent aucun
# contenu, il est injecté au pré-rendu. C'est donc dist/ qui part sur Pages,
# reconstruit à chaque push.
#
# ⚠ Prérequis côté dépôt : Settings → Pages → Source doit valoir
# « GitHub Actions ». Tant que la source reste « Deploy from a branch »,
# ce workflow s'exécute sans que rien ne change en ligne.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# une seule publication à la fois, sans interrompre celle qui est en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # inutile de pré-rendre un site incohérent
      - name: Cohérence des traductions, des données et des fichiers
        run: python3 outils/verifier.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Chromium pèse quelques centaines de Mo et ne change qu'avec la version
      # de Puppeteer : le cacher épargne le téléchargement à chaque exécution.
      - name: Cache du navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Pré-rendu
        run: npm run build

      # dernier filet avant publication : verifier.py ne juge que les fichiers,
      # ceci ouvre le site produit dans un navigateur. Un pré-rendu cassé
      # s'arrête donc ici plutôt qu'en ligne.
      - name: Tests du site produit
        run: npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
