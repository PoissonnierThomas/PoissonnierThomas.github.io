  <script>
    /* Masque le contenu jusqu'à ce que js/app.js l'ait rendu et traduit.
       Doit rester synchrone et en <head> : différé, il masquerait après un
       premier rendu, soit exactement le clignotement qu'il doit éviter.
       Le délai de sécurité réaffiche la page si le module ne démarre jamais
       (404, réseau coupé, erreur de parsing) — mieux vaut du français non
       traduit qu'une page blanche. */
    document.documentElement.dataset.chargement = '';
    setTimeout(function () {
      delete document.documentElement.dataset.chargement;
    }, 3000);
  </script>
